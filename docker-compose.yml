version: '3.8'

services:
  voxel-fps:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voxel-strike-game
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
    volumes:
      - voxel_game_data:/app/data

volumes:
  voxel_game_data:
    driver: local
